[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bit-automation"
version = "1.0.0"
description = "BitBrowser + Playwright (CDP) automation skills for crawling and manipulating websites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "requests>=2.28",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

# Shared modules at root; skill-specific scripts live under .agent/skills/
[tool.setuptools]
py-modules = [
    "bit_api",
]
